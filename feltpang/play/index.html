<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6eddf" />
    <title>펠트팡</title>
    <script type="module" crossorigin src="./assets/index-OEA20dfr.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D_a2gtCI.css">
  </head>
  <body>
    <div id="app">
      <h1 id="title" class="title"><img src="./ui/logo.webp" alt="펠트팡" /></h1>
      <header class="hud">
        <div class="stat">
          <div class="label">점수</div>
          <div id="score" class="value">0</div>
          <div class="best">최고 <strong id="best">0</strong></div>
        </div>
        <div id="items" class="items" aria-label="도움 아이템">
          <button id="item-cut" class="btn ghost item"><img class="ico" src="./ui/icon-item-cut.webp" alt="" />가위<span class="badge"></span></button>
          <button id="item-swap" class="btn ghost item"><img class="ico" src="./ui/icon-item-swap.webp" alt="" />실타래<span class="badge"></span></button>
          <button id="item-shake" class="btn ghost item"><img class="ico" src="./ui/icon-item-shake.webp" alt="" />흔들기<span class="badge"></span></button>
        </div>
        <div class="stat right">
          <div class="label">다음</div>
          <canvas id="next"></canvas>
        </div>
      </header>

      <main id="stage">
        <canvas id="game" aria-label="게임 화면"></canvas>
        <p id="pick-hint" class="pick-hint" hidden>뺄 조각을 눌러요 · 가위를 다시 누르면 취소</p>
      </main>

      <div id="evolution" class="evolution" aria-label="진화 순서"></div>

      <footer class="bar actions">
        <button id="btn-settings" class="btn tool ghost">
          <img class="ico" src="./ui/icon-settings.svg" alt="" /><span>설정</span>
        </button>
        <button id="btn-attend" class="btn tool ghost">
          <img class="ico" src="./ui/icon-check.webp" alt="" /><span>출석</span><i class="dot" hidden></i>
        </button>
        <button id="btn-ranking" class="btn tool ghost" hidden>
          <img class="ico" src="./ui/icon-ranking.webp" alt="" /><span>순위</span>
        </button>
        <button id="btn-photos" class="btn tool">
          <img class="ico" src="./ui/icon-photo.webp" alt="" /><span>내 사진</span>
        </button>
      </footer>
    </div>

    <div id="gameover" class="modal" hidden>
      <div class="sheet">
        <h2>게임 오버</h2>
        <p class="big" id="final-score">0</p>
        <p class="sub">최고 점수 <span id="final-best">0</span></p>
        <p id="over-rank" class="over-rank" hidden></p>
        <button id="btn-revive" class="btn wide" hidden>광고 보고 이어하기</button>
        <p id="revive-hint" class="hint revive-hint" hidden>위쪽 조각을 치우고 지금 점수로 계속해요</p>
        <div class="row">
          <button id="btn-over-ranking" class="btn ghost" hidden>
            <img class="ico" src="./ui/icon-ranking.webp" alt="" />순위 보기
          </button>
          <button id="btn-restart" class="btn">
            <img class="ico" src="./ui/icon-restart.webp" alt="" />다시 하기
          </button>
        </div>
        <button id="btn-over-photos" class="btn ghost wide">
          <img class="ico" src="./ui/icon-photo.webp" alt="" />사진 바꾸고 다시 하기
        </button>
      </div>
    </div>

    <div id="start" class="modal" hidden></div>
    <div id="photos" class="modal" hidden></div>
    <div id="ranking" class="modal" hidden></div>
    <div id="attend" class="modal" hidden></div>

    <div id="settings" class="modal" hidden>
      <div class="sheet">
        <h2>설정</h2>
        <div class="setting-list">
          <button id="btn-sound" class="setting-row" aria-pressed="true">
            <img class="ico" src="./ui/icon-sound-on.webp" alt="" /><span class="setting-name">소리</span><i class="switch" aria-hidden="true"></i>
          </button>
          <button id="btn-haptic" class="setting-row" aria-pressed="true" hidden>
            <img class="ico" src="./ui/icon-haptic-on.webp" alt="" /><span class="setting-name">진동</span><i class="switch" aria-hidden="true"></i>
          </button>
          <div id="remind-row" class="setting-row remind-row" hidden>
            <img class="ico" src="./ui/icon-check.webp" alt="" />
            <span class="setting-name">출석 알림<small id="remind-sub">매일 출석부 도장을 찍을 시간에 알려 드려요</small></span>
            <button id="btn-remind" class="btn ghost small">알림 받기</button>
          </div>
        </div>
        <p id="remind-msg" class="hint remind-msg" hidden></p>
        <button class="btn wide" data-act="close">닫기</button>
      </div>
    </div>

  </body>
</html>
