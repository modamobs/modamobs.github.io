<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="배를 움직여 여수 밤바다의 별을 받고 운석을 피하는 미니게임">
<style>body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>여수 밤바다 별 줍기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root {
    --sky-top: #070b24;
    --sky-mid: #14224f;
    --sea: #0b2a4a;
    --lamp: #ffd166;
    --foam: #e8f1ff;
    --danger: #ff6b6b;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--sky-top);
    color: var(--foam);
    font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage { position: relative; width: 100%; height: 100%; max-width: 560px; margin-inline: auto; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; inset: 0 0 auto 0;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 16px; font-size: 20px; pointer-events: none;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  #combo { color: var(--lamp); min-width: 5em; text-align: center; }
  .panel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px 16px; text-align: center;
    background: rgba(7, 11, 36, .72);
  }
  .panel h1 { font-size: clamp(30px, 8vw, 44px); font-weight: 400; color: var(--lamp); margin: 0; text-wrap: balance; }
  .panel p { margin: 0; font-size: 18px; line-height: 1.6; max-width: 22em; }
  .panel .big { font-size: 28px; }
  button {
    font: inherit; font-size: 22px; color: #1b1300; background: var(--lamp);
    border: 0; border-radius: 999px; padding: 12px 34px; cursor: pointer;
    box-shadow: 0 6px 0 #b8892a;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8892a; }
  button:focus-visible { outline: 3px solid var(--foam); outline-offset: 3px; }
</style>
</head>
<body>


<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud">
    <span id="score">점수 0</span>
    <span id="combo"></span>
    <span id="lives">❤️❤️❤️</span>
  </div>
  <div class="panel" id="startPanel">
    <h1>여수 밤바다 별 줍기</h1>
    <p>배를 좌우로 움직여 떨어지는 별을 받으세요.<br>⭐ 10점 · 🌟 50점 · ☄️ 운석은 피하기!</p>
    <p>조작: 화면 드래그 또는 ← → 키</p>
    <button id="startBtn" type="button">출항하기</button>
  </div>
  <div class="panel" id="overPanel" hidden>
    <h1>항해 끝!</h1>
    <p class="big" id="finalScore">0점</p>
    <p id="bestScore"></p>
    <button id="retryBtn" type="button">다시 출항</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ----- 상태 -----
  const bgStars = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random() * 0.6, p: Math.random() * 6.28 }));
  let state = 'ready';            // ready | play | over
  let boatX = 0.5, targetX = 0.5; // 0~1 비율
  let items = [], particles = [], popups = [];
  let score = 0, lives = 3, combo = 0, best = 0;
  let elapsed = 0, spawnTimer = 0, shake = 0;
  const keys = { left: false, right: false };

  // ----- 소리 (WebAudio, 파일 없이) -----
  let audio = null;
  function beep(freq, dur, type = 'sine', vol = 0.15) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) { /* 소리가 안 나도 게임은 계속 */ }
  }

  // ----- 입력 -----
  function pointerTo(e) {
    const r = canvas.getBoundingClientRect();
    targetX = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  }
  canvas.addEventListener('pointerdown', pointerTo);
  canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) pointerTo(e); });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });
  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);

  function start() {
    state = 'play';
    items = []; particles = []; popups = [];
    score = 0; lives = 3; combo = 0; elapsed = 0; spawnTimer = 0.5; shake = 0;
    boatX = targetX = 0.5;
    $('startPanel').hidden = true; $('overPanel').hidden = true;
    updateHud();
    beep(523, 0.12); setTimeout(() => beep(784, 0.18), 120);
  }

  function gameOver() {
    state = 'over';
    best = Math.max(best, score);
    $('finalScore').textContent = score + '점';
    $('bestScore').textContent = '이번 접속 최고 기록 ' + best + '점';
    $('overPanel').hidden = false;
    beep(220, 0.5, 'sawtooth', 0.12);
  }

  function updateHud() {
    $('score').textContent = '점수 ' + score;
    $('lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
    $('combo').textContent = combo >= 3 ? combo + ' 콤보!' : '';
  }

  // ----- 난이도: 시간이 지날수록 빨라지고 운석이 늘어남 -----
  const level = () => 1 + elapsed / 20;
  function spawn() {
    const roll = Math.random();
    const meteorChance = Math.min(0.45, 0.18 + elapsed / 200);
    let kind = 'star';
    if (roll < meteorChance) kind = 'meteor';
    else if (roll > 0.93) kind = 'bigstar';
    items.push({
      kind,
      x: 0.06 + Math.random() * 0.88,
      y: -30,
      vy: (150 + Math.random() * 70) * level() * (kind === 'bigstar' ? 1.35 : 1),
      rot: Math.random() * 6.28
    });
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, s = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.6, color });
    }
  }

  // ----- 업데이트 -----
  function update(dt) {
    if (state !== 'play') return;
    elapsed += dt;

    if (keys.left) targetX -= 1.1 * dt;
    if (keys.right) targetX += 1.1 * dt;
    targetX = Math.min(1, Math.max(0, targetX));
    boatX += (targetX - boatX) * Math.min(1, dt * 14);

    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawn(); spawnTimer = Math.max(0.28, 0.85 / level()); }

    const boatY = H * 0.8, bx = boatX * W, catchR = 38;
    for (const it of items) {
      it.y += it.vy * dt; it.rot += dt * 2;
      const ix = it.x * W;
      if (!it.done && Math.abs(it.y - boatY) < 30 && Math.abs(ix - bx) < catchR) {
        it.done = true;
        if (it.kind === 'meteor') {
          lives--; combo = 0; shake = 0.35;
          burst(ix, boatY, '#ff6b6b', 18); beep(110, 0.3, 'square', 0.12);
          if (navigator.vibrate) navigator.vibrate(120);
          if (lives <= 0) { updateHud(); gameOver(); return; }
        } else {
          combo++;
          const base = it.kind === 'bigstar' ? 50 : 10;
          const gain = base * (1 + Math.floor(combo / 5));
          score += gain;
          popups.push({ x: ix, y: boatY - 30, text: '+' + gain, life: 0.8 });
          burst(ix, boatY - 10, '#ffd166', it.kind === 'bigstar' ? 20 : 8);
          beep(660 + Math.min(combo, 12) * 40, 0.09, 'triangle');
        }
        updateHud();
      } else if (!it.done && it.y > H * 0.86) {
        it.done = true;
        if (it.kind !== 'meteor') { if (combo >= 3) beep(300, 0.08); combo = 0; updateHud(); }
        burst(ix, H * 0.86, '#9ec5ff', 5);
      }
    }
    items = items.filter(it => !it.done);

    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 50 * dt; p.life -= dt; }
    popups = popups.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt);
  }

  // ----- 그리기 -----
  function draw(t) {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * shake * 3, (Math.random() - 0.5) * 14 * shake * 3);

    const seaY = H * 0.84;
    const g = ctx.createLinearGradient(0, 0, 0, seaY);
    g.addColorStop(0, '#070b24'); g.addColorStop(1, '#1b2f6b');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, seaY + 20);

    for (const s of bgStars) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 1.5 + s.p);
      ctx.fillStyle = '#e8f1ff';
      ctx.fillRect(s.x * W, s.y * H, 2, 2);
    }
    ctx.globalAlpha = 1;

    // 달
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath(); ctx.arc(W * 0.82, H * 0.13, 26, 0, 6.28); ctx.fill();

    // 돌산대교 느낌의 다리 실루엣과 조명
    const by = seaY - 34;
    ctx.strokeStyle = '#0a1230'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-10, by); ctx.lineTo(W + 10, by); ctx.stroke();
    for (const tx of [0.3, 0.7]) {
      ctx.beginPath(); ctx.moveTo(tx * W, by); ctx.lineTo(tx * W, by - 70); ctx.stroke();
      ctx.lineWidth = 1.5;
      for (let k = 1; k <= 5; k++) {
        ctx.beginPath(); ctx.moveTo(tx * W, by - 70); ctx.lineTo(tx * W - k * W * 0.045, by); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tx * W, by - 70); ctx.lineTo(tx * W + k * W * 0.045, by); ctx.stroke();
      }
      ctx.lineWidth = 5;
    }
    for (let i = 0; i <= 14; i++) {
      ctx.fillStyle = ['#ffd166', '#ff8fab', '#8ecae6'][i % 3];
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 2 + i);
      ctx.beginPath(); ctx.arc((i / 14) * W, by, 2.5, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 바다
    ctx.fillStyle = '#0b2a4a';
    ctx.beginPath(); ctx.moveTo(-20, H + 20); ctx.lineTo(-20, seaY);
    for (let x = -20; x <= W + 20; x += 10) ctx.lineTo(x, seaY + Math.sin(x * 0.03 + t * 2) * 4);
    ctx.lineTo(W + 20, H + 20); ctx.closePath(); ctx.fill();

    // 떨어지는 것들
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const it of items) {
      const size = it.kind === 'bigstar' ? 40 : 32;
      ctx.font = size + 'px serif';
      ctx.fillText(it.kind === 'meteor' ? '☄️' : it.kind === 'bigstar' ? '🌟' : '⭐', it.x * W, it.y);
    }

    // 배
    const boatY = H * 0.8 + Math.sin(t * 2.2) * 3;
    ctx.save();
    ctx.translate(boatX * W, boatY);
    ctx.rotate((targetX - boatX) * 1.2);
    ctx.font = '52px serif';
    ctx.fillText('⛵', 0, 0);
    ctx.restore();

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    ctx.font = '22px "Jua", sans-serif';
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, p.life / 0.8);
      ctx.fillStyle = '#ffd166';
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 테스트·디버그용 창구
  window.__game = { get state() { return state; }, get score() { return score; }, get lives() { return lives; }, get items() { return items; }, setTarget(x) { targetX = x; } };
})();
</script>

</body>
</html>
