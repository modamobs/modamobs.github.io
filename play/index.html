<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>플레이 — 모브스 게임</title>
  <meta name="description" content="브라우저에서 바로 플레이합니다.">
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/portal.css?v=1">

  <script>
    document.documentElement.setAttribute(
      'data-theme', localStorage.getItem('theme') || 'dark');
  </script>

  <style>
    /* 플레이어는 화면을 꽉 채웁니다. 주소창 높이가 변해도 흔들리지 않도록 dvh를 씁니다. */
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    .player-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      padding-top: max(8px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--line-soft);
      background: var(--bg);
      flex: none;
    }
    .player-bar .title {
      font-size: .95rem;
      font-weight: 600;
      color: var(--heading);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-bar .right {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: .88rem;
      color: var(--text);
      transition: color .16s ease, background-color .16s ease;
      flex: none;
    }
    .back:hover { color: var(--accent); background: var(--accent-dim); }

    .stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(60% 60% at 50% 0%, var(--accent-dim), transparent 70%),
        var(--bg-soft);
      padding: 10px;
    }
    .frame-box {
      width: 100%;
      height: 100%;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line-soft);
      background: #000;
      box-shadow: var(--shadow);
    }
    /* 세로 화면 게임은 폰 비율로 가운데에 띄웁니다. */
    .frame-box.portrait {
      aspect-ratio: 9 / 16;
      width: auto;
      max-width: min(100%, 520px);
    }
    .frame-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* 화면이 좁으면 여백 없이 꽉 채웁니다. */
    @media (max-width: 640px) {
      .stage { padding: 0; }
      .frame-box, .frame-box.portrait {
        border: 0; border-radius: 0; max-width: 100%;
        width: 100%; height: 100%; aspect-ratio: auto;
      }
    }

    .notice {
      max-width: 34ch;
      text-align: center;
      color: var(--text);
      padding: 24px;
    }
    .notice h1 { font-size: 1.1rem; color: var(--heading); margin: 0 0 8px; }
    .notice a { color: var(--accent); }
  </style>
</head>
<body>

  <div class="player-bar">
    <a class="back" href="/">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M11 18l-6-6 6-6"/>
      </svg>
      목록
    </a>
    <span class="title" id="title">플레이</span>

    <div class="right">
      <a class="ghost-link" id="aboutLink" href="#" hidden>소개</a>
      <button class="icon-btn" id="fsBtn" aria-label="전체 화면">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <script src="/js/games.js?v=1"></script>
  <script>
    (function () {
      'use strict';

      const params = new URLSearchParams(location.search);
      const slug   = params.get('g');
      const stage  = document.getElementById('stage');
      const game   = (typeof GAMES !== 'undefined')
        ? GAMES.find(g => g.slug === slug)
        : null;

      /* 없는 게임이거나 아직 웹 빌드가 올라가지 않은 경우 */
      if (!game || game.status !== 'web' || !game.playable || !game.play) {
        document.getElementById('title').textContent = game ? game.title : '게임을 찾을 수 없습니다';
        stage.innerHTML =
          '<div class="notice"><h1>' +
          (game ? '아직 웹에서 플레이할 수 없습니다' : '게임을 찾을 수 없습니다') +
          '</h1><p>' +
          (game && game.store
            ? '앱으로는 플레이할 수 있습니다.'
            : '목록에서 다른 게임을 골라 주세요.') +
          '</p><p><a href="/">게임 목록으로</a>' +
          (game && game.store
            ? ' · <a href="' + game.store + '" target="_blank" rel="noopener noreferrer">Google Play</a>'
            : '') +
          '</p></div>';
        return;
      }

      document.title = game.title + ' — 모브스 게임';
      document.getElementById('title').textContent = game.title;

      if (game.about) {
        const a = document.getElementById('aboutLink');
        a.href = game.about;
        a.hidden = false;
      }

      const box = document.createElement('div');
      box.className = 'frame-box' + (game.portrait ? ' portrait' : '');
      const frame = document.createElement('iframe');
      frame.src = game.play;
      frame.title = game.title;
      frame.allow = 'autoplay; fullscreen; gamepad; accelerometer; gyroscope';
      frame.setAttribute('allowfullscreen', '');
      box.appendChild(frame);
      stage.appendChild(box);

      /* 전체 화면: 지원하지 않는 브라우저(구형 iOS Safari)에서는 조용히 무시됩니다. */
      document.getElementById('fsBtn').addEventListener('click', function () {
        const el = box;
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else if (el.requestFullscreen) {
          el.requestFullscreen().catch(function () {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      });
    })();
  </script>
</body>
</html>
