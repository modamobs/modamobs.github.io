<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모브스 게임 — 설치 없이 바로 즐기는 게임</title>
  <meta name="description" content="퍼즐·캐주얼 게임을 브라우저에서 설치 없이 바로 플레이하세요. 모브스가 만든 게임 모음입니다.">

  <!-- 소셜 공유 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="모브스 게임">
  <meta property="og:description" content="설치도 로그인도 없이, 브라우저에서 바로 즐기는 퍼즐·캐주얼 게임 모음.">
  <meta property="og:url" content="https://modamobs.github.io/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/portal.css?v=1">

  <!-- 저장된 테마를 본문 렌더링 전에 적용해 깜빡임을 막습니다. -->
  <script>
    document.documentElement.setAttribute(
      'data-theme', localStorage.getItem('theme') || 'dark');
  </script>
</head>
<body>

  <a href="#games" class="sr-only">게임 목록으로 건너뛰기</a>

  <!-- ===== 상단 바 ===== -->
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">모브스 게임<span class="dot">.</span></a>

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="search" type="search" placeholder="게임 검색" aria-label="게임 검색" autocomplete="off">
      </div>

      <div class="topbar-actions">
        <a class="ghost-link" href="/about/">만든 사람</a>
        <button class="icon-btn" id="themeToggle" aria-label="다크 모드 전환">
          <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="19" height="19" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== 히어로 ===== -->
  <section class="hero">
    <div class="wrap">
      <h1>설치 없이, <em>바로 플레이</em></h1>
      <p>
        브라우저에서 곧장 시작하는 퍼즐과 캐주얼 게임 모음입니다.
        마음에 들면 앱으로도 가져갈 수 있습니다.
      </p>
    </div>
  </section>

  <!-- ===== 게임 목록 ===== -->
  <main id="games">
    <div class="wrap">
      <div class="filters" id="filters" role="group" aria-label="장르 필터">
        <!-- portal.js가 채웁니다 -->
      </div>

      <div id="gameGrid">
        <!-- portal.js가 채웁니다 -->
      </div>

      <p class="empty-msg" id="emptyMsg" hidden>조건에 맞는 게임이 없습니다.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; <span id="year"></span> Smart it</span>
      <a href="/about/">포트폴리오</a>
      <a href="mailto:yamoda24@gmail.com">문의</a>
      <span class="spacer"></span>
      <a href="https://github.com/modamobs" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </footer>

  <script src="/js/games.js?v=1"></script>
  <script src="/js/portal.js?v=1"></script>
</body>
</html>
