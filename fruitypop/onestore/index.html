<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>프루티 팝</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Lilita+One&display=swap">
<style>
/* Layout: one-screen game. HUD strip sized to the board width, the board canvas, then controls. Single committed look: a mint candy-shop wall with a deep teal board. */
:root {
  --bg: #bde7d5;
  --dot-a: rgba(255, 255, 255, .5);
  --dot-b: rgba(255, 120, 165, .22);
  --ink: #26213a;
  --ink-soft: #5d5873;
  --panel: #fbfffd;
  --shadow: #84bfa8;
  --accent: #ff4f86;
  --accent-dark: #c92c62;
  --gold: #ffbf2e;
  --ok: #1f9e62;
  --board-rim: #e9f1ff;
  --board: #4a5d92;
  --tile-a: #5b70a9;
  --tile-b: #52669d;
  --hud-hi: #ffe0ee;
  --hud-lo: #ff9fc8;
  --hud-edge: #d9578b;
  --hud-ink: #d92f6b;
  --bar-hi: #5fd0ff;
  --bar-lo: #3a86ff;
  --jelly: #ff8cc0;
  --scrim: rgba(22, 52, 49, .58);
  --font-display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Lilita One", "Jua", system-ui, sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
html, body { overflow-x: clip; }
/* 콤보 배지가 커지며 화면 밖으로 삐져나가면 폰이 화면을 잠깐 축소해 보여준다. 확대·축소와 가로 넘침을 막는다 */
#app { overflow-x: clip; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 12px 12px, var(--dot-a) 3px, transparent 3.6px),
    radial-gradient(circle at 36px 36px, var(--dot-b) 3px, transparent 3.6px);
  background-size: 48px 48px;
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: var(--zone-bg, url("assets/bg.jpg")) center top / cover no-repeat;
  filter: saturate(1.1);
}
/* 지도 구역이 바뀔 때 새 배경을 위에 겹쳐 서서히 드러낸다 */
#zoneFade { position: fixed; inset: 0; z-index: -1; background: center top / cover no-repeat; filter: saturate(1.1); opacity: 0; pointer-events: none; }
#zoneFade.on { opacity: 1; transition: opacity .6s ease; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
#app {
  box-sizing: border-box;
  min-height: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding-block: max(12px, env(safe-area-inset-top, 0px), var(--os-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px), var(--os-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud {
  box-sizing: border-box;
  width: 100%;
  max-width: calc(var(--bw, 560px) + 12px);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: linear-gradient(180deg, var(--hud-hi), var(--hud-lo));
  border: 3px solid var(--panel);
  border-radius: 22px;
  box-shadow: 0 5px 0 var(--hud-edge), 0 12px 20px rgba(90, 20, 55, .25);
}
.hud-moves { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
.hud-lv { font-size: 12px; color: var(--hud-ink); }
.hud-lv b { font-family: var(--font-num); font-weight: normal; font-size: 15px; }
.moves-num {
  font-family: var(--font-num);
  font-size: 46px;
  line-height: .95;
  color: var(--hud-ink);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 var(--panel), 0 -1px 0 var(--panel), 2px 0 0 var(--panel), -2px 0 0 var(--panel), 0 5px 6px rgba(120, 20, 60, .3);
}
.hud-cap { font-size: 11px; letter-spacing: .06em; color: var(--hud-ink); }
.hud-moves.low .moves-num { animation: throb .9s ease-in-out infinite; }
.bump { animation: bump .25s ease-out; }
.hud-mid { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.goal-pill {
  background: linear-gradient(180deg, #ff86b6, #ff5a96);
  border: 2px solid #ffd3e5;
  border-radius: 999px;
  padding: 3px 12px;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35);
}
.goal-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; align-items: center; min-height: 34px; }
.goal {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-num);
  font-size: 22px;
  color: var(--panel);
  text-shadow: 0 2px 0 rgba(160, 20, 70, .45);
  font-variant-numeric: tabular-nums;
}
.goal canvas { width: 30px; height: 30px; }
.goal.done::after { content: "✓"; font-size: 18px; }
.goal-summary .goal { color: var(--hud-ink); text-shadow: none; }
.hud-score { font-size: 12px; color: var(--hud-ink); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-score span:first-child { font-family: var(--font-num); font-size: 15px; font-variant-numeric: tabular-nums; }
.hud-badge {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffffff, #ffe3ef 60%, #ffc1da);
  border: 3px solid var(--panel);
  box-shadow: 0 3px 0 var(--hud-edge), inset 0 -4px 8px rgba(217, 87, 139, .3);
  display: grid;
  place-items: center;
}
.hud-badge { overflow: visible; }
.hud-badge .rig { width: 122%; height: 122%; margin-top: -14px; animation: bob 2.4s ease-in-out infinite; pointer-events: none; }
.bar {
  position: relative;
  height: 12px;
  margin: 4px 12px 0;
  border-radius: 6px;
  background: rgba(255, 255, 255, .7);
  box-shadow: inset 0 1px 3px rgba(150, 30, 80, .35);
}
.bar-fill {
  height: 100%;
  width: 0;
  border-radius: 6px;
  background: linear-gradient(180deg, var(--bar-hi), var(--bar-lo));
  transition: width .35s ease-out;
}
.tick {
  position: absolute;
  top: 50%;
  width: 26px;
  height: 26px;
  transform: translate(-50%, -54%);
  background: url("assets/star_off.png") center / contain no-repeat;
  transition: transform .3s;
}
.tick.on { background-image: url("assets/star_on.png"); transform: translate(-50%, -54%) scale(1.25); }
/* 점수판은 위, 아이템 바는 맨 아래에 붙고 게임판은 그 사이 가운데에 온다 */
.board-wrap { position: relative; touch-action: none; margin-block: auto; }
#board { display: block; touch-action: none; outline: none; border-radius: 20px; cursor: pointer; }
#board:focus-visible { box-shadow: 0 0 0 3px var(--ink); }
.boosters {
  display: flex;
  gap: 14px;
  justify-content: center;
  padding: 9px 18px 11px;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--hud-hi), var(--hud-lo));
  border: 3px solid var(--panel);
  box-shadow: 0 4px 0 var(--hud-edge), 0 10px 18px rgba(90, 20, 55, .22);
}
.boost {
  position: relative;
  width: 56px;
  height: 56px;
  padding: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 0;
  background: url("assets/btn_round.png") center / 100% 100% no-repeat;
  box-shadow: none;
  filter: drop-shadow(0 4px 0 rgba(29, 79, 179, .55));
  transition: transform .15s, filter .15s;
}
.boost:active { box-shadow: none; transform: translateY(3px); filter: none; }
.boost img { width: 74%; height: 74%; filter: drop-shadow(0 2px 1px rgba(0, 20, 80, .35)); pointer-events: none; }
.b-count {
  position: absolute;
  right: -7px;
  bottom: -7px;
  min-width: 24px;
  height: 24px;
  box-sizing: border-box;
  border-radius: 12px;
  padding: 0 5px;
  background: linear-gradient(180deg, #ffd56a, #ff9d1c);
  border: 2px solid var(--panel);
  font-family: var(--font-num);
  font-size: 14px;
  line-height: 20px;
  color: #7a3b00;
  text-shadow: none;
}
.boost[aria-pressed="true"] {
  transform: translateY(-5px) scale(1.12);
  box-shadow: none;
  filter: drop-shadow(0 0 10px rgba(255, 220, 90, .95)) drop-shadow(0 0 4px #ffffff);
}
.boost.empty { filter: grayscale(.85) brightness(.95); }
.boost.locked { filter: grayscale(1) brightness(.9); }
.boost.locked img { opacity: .4; }
.boost.locked .b-count { background: #6b6577; color: var(--panel); font-family: var(--font-display); font-size: 11px; }
.boost-tag { background: linear-gradient(180deg, #5fd0ff, #3a86ff); }
.unlock-art { width: 92px; height: 92px; filter: drop-shadow(0 0 14px rgba(255, 220, 90, .95)); animation: unlockSpin .9s cubic-bezier(.2, 1.5, .4, 1) .2s both; }
@keyframes unlockSpin { from { transform: scale(0) rotate(-300deg); opacity: 0; } to { transform: none; opacity: 1; } }
.boost.fire { animation: boostFire .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes boostFire { 0% { transform: scale(1); } 30% { transform: scale(.75) rotate(-12deg); } 100% { transform: scale(1) rotate(0); } }
.boost.empty .b-count { background: #d8d4de; color: #6b6577; }
.boost.ad .b-count { background: #ffcd3c; color: #8a3a00; font-size: 12px; }
.boost-hint {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  max-width: 90%;
  margin: 0;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(38, 33, 58, .88);
  color: var(--panel);
  font-family: var(--font-display);
  font-size: 14px;
  text-align: center;
  pointer-events: none;
}
/* 콤보: 보드가 툭 튀고 테두리가 빛나며, 배지가 단계별로 색이 바뀐다 */
.board-wrap.combo-glow #board {
  box-shadow: 0 0 calc(10px + 28px * var(--glow, .3)) calc(2px + 8px * var(--glow, .3)) hsl(var(--hue, 330) 100% 68% / .9);
  transition: box-shadow .2s;
}
.combo-badge {
  position: absolute;
  top: -16px;
  right: -8px;
  z-index: 6;
  display: flex;
  align-items: baseline;
  gap: 2px;
  padding: 4px 12px 6px;
  border-radius: 16px;
  border: 3px solid var(--panel);
  background: linear-gradient(180deg, #ff8fbd, #ff3f7f);
  box-shadow: 0 4px 0 #b02a5e, 0 0 18px rgba(255, 90, 150, .7);
  color: var(--panel);
  font-family: var(--font-num);
  text-shadow: 0 2px 0 rgba(120, 10, 50, .45);
  transform: rotate(8deg);
  pointer-events: none;
}
.combo-badge .cb-x { font-size: 20px; }
.combo-badge .cb-n { font-size: 36px; line-height: 1; }
.combo-badge .cb-t { margin-left: 4px; font-family: var(--font-display); font-size: 15px; }
.combo-badge.t2 { background: linear-gradient(180deg, #ffd96e, #ff8a1f); box-shadow: 0 4px 0 #c45a00, 0 0 24px rgba(255, 170, 40, .85); }
.combo-badge.t3 {
  background: linear-gradient(90deg, #ff5c8a, #ffb21f, #5fd0ff, #a66bff, #ff5c8a);
  background-size: 300% 100%;
  box-shadow: 0 4px 0 #7a3bd0, 0 0 30px rgba(190, 120, 255, .9);
  animation: rainbow 1s linear infinite;
}
.combo-badge.bump { animation: badgeBump .4s cubic-bezier(.2, 1.8, .4, 1); }
.combo-badge.t3.bump { animation: badgeBump .4s cubic-bezier(.2, 1.8, .4, 1), rainbow 1s linear infinite; }
.combo-badge.out { animation: badgeOut .35s ease-in both; }
@keyframes badgeBump { 0% { transform: rotate(-10deg) scale(1.9); } 100% { transform: rotate(8deg) scale(1); } }
@keyframes badgeOut { to { transform: rotate(20deg) scale(.4); opacity: 0; } }
@keyframes rainbow { to { background-position: 300% 0; } }
.board-wrap.aiming #board { box-shadow: 0 0 0 4px var(--panel), 0 0 26px 8px rgba(255, 220, 90, .85); cursor: crosshair; }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.map {
  box-sizing: border-box;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding-block: max(14px, var(--os-top, 0px)) max(24px, var(--os-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.map-head {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 2;
  box-sizing: border-box;
  width: 100%;
  max-width: 440px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 18px;
  background: linear-gradient(180deg, var(--hud-hi), var(--hud-lo));
  border: 3px solid var(--panel);
  border-radius: 22px;
  box-shadow: 0 5px 0 var(--hud-edge), 0 12px 20px rgba(90, 20, 55, .25);
}
.map-head .logo { display: block; height: 58px; width: auto; filter: drop-shadow(0 3px 2px rgba(150, 20, 70, .3)); }
.map-head h1 {
  margin: -6px 0;
  font-family: var(--font-display);
  font-weight: normal;
  font-size: 32px;
  color: var(--hud-ink);
  text-shadow: 0 3px 0 var(--panel);
}
.map-stars { font-family: var(--font-num); font-size: 22px; color: var(--hud-ink); white-space: nowrap; }
.map-opt { margin-left: auto; margin-right: 0; width: 46px; height: 46px; flex: none; }
.map-opt svg { width: 24px; height: 24px; }
.test-badge {
  position: absolute;
  bottom: -14px;
  left: 50%;
  transform: translateX(-50%);
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--panel);
  font-size: 12px;
  white-space: nowrap;
}
.map-stars { display: flex; align-items: center; gap: 4px; margin: 0; }
.map-stars img { width: 30px; height: 30px; }
.map-path { position: relative; flex: none; }
/* 구역 경계에 걸린 리본 팻말, 그리고 새 구역에 들어설 때 화면 가운데 뜨는 이름 */
.zone-sign {
  position: absolute;
  transform: translate(-50%, -50%) rotate(-2deg);
  padding: 10px 36px 22px;
  font-family: var(--font-display);
  font-size: 22px;
  white-space: nowrap;
  color: var(--panel);
  text-shadow: 0 2px 0 #b02a5e, 0 0 6px rgba(150, 20, 70, .5);
  background: url("assets/ribbon.png") center / 100% 100% no-repeat;
  filter: drop-shadow(0 4px 3px rgba(90, 20, 55, .3));
  pointer-events: none;
}
.zone-title {
  position: fixed;
  top: 40%;
  left: 50%;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-display);
  font-size: 30px;
  white-space: nowrap;
  color: #fff;
  text-shadow: 0 2px 0 rgba(90, 20, 55, .55), 0 0 14px rgba(60, 10, 40, .6);
  transform: translate(-50%, -50%);
  opacity: 0;
  pointer-events: none;
}
.zone-title::before, .zone-title::after { content: ''; width: 54px; height: 3px; border-radius: 2px; background: #fff; box-shadow: 0 1px 3px rgba(60, 10, 40, .5); }
.zone-title.show { animation: zoneTitle 2.6s ease both; }
@keyframes zoneTitle { 0% { opacity: 0; transform: translate(-50%, -30%); } 15%, 75% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -50%); } }
.map-path svg { position: absolute; inset: 0; overflow: visible; }
.node {
  position: absolute;
  width: 74px;
  height: 74px;
  margin: -37px 0 0 -37px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--font-num);
  font-size: 28px;
  color: var(--panel);
  text-shadow: 0 2px 0 #b02a5e, 0 0 4px rgba(150, 20, 70, .6);
  background: url("assets/node_done.png") center / contain no-repeat;
  box-shadow: none;
  filter: drop-shadow(0 4px 2px rgba(120, 20, 60, .3));
}
.node:active { box-shadow: none; }
.node.cur {
  width: 86px;
  height: 86px;
  margin: -43px 0 0 -43px;
  background-image: url("assets/node_cur.png");
  color: #7a3b00;
  text-shadow: 0 2px 0 rgba(255, 255, 255, .6);
  animation: bob 1.6s ease-in-out infinite;
}
.node.cur::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 4px solid rgba(255, 255, 255, .9);
  animation: nodeRing 1.6s ease-out infinite;
  pointer-events: none;
}
@keyframes nodeRing { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.45); opacity: 0; } }
.node.cleared { animation: nodePop .45s cubic-bezier(.2, 1.6, .4, 1); }
.node.unlocking { animation: lockShake .42s ease-in-out; }
.node.opened { animation: nodeOpen .6s cubic-bezier(.2, 1.7, .4, 1), bob 1.6s ease-in-out .6s infinite; }
.n-stars .star-pop { animation: starPop .45s cubic-bezier(.2, 1.8, .4, 1) both; }
@keyframes nodePop { 50% { transform: scale(1.2); } }
@keyframes lockShake { 20% { transform: rotate(-14deg); } 40% { transform: rotate(11deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(5deg); } }
@keyframes nodeOpen { from { transform: scale(.3); } }
@keyframes starPop { from { transform: scale(2.6) rotate(-50deg); opacity: 0; } }
.node.locked {
  background-image: url("assets/node_locked.png");
  cursor: not-allowed;
}
.n-stars {
  position: absolute;
  top: calc(100% - 12px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 1px;
}
.n-stars span { width: 20px; height: 20px; background: url("assets/star_on.png") center / contain no-repeat; }
.n-stars span:nth-child(2) { margin-top: 4px; }
.n-stars .off { background-image: url("assets/star_off.png"); }
.n-tag {
  position: absolute;
  top: 50%;
  left: calc(100% + 6px);
  transform: translateY(-50%);
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--panel);
  font-family: var(--font-display);
  font-size: 13px;
  white-space: nowrap;
  text-shadow: none;
}
.node.tag-left .n-tag { left: auto; right: calc(100% + 6px); }
.intro-art { width: 84px; height: 84px; }
.intro-pair { display: flex; justify-content: center; align-items: flex-end; gap: 4px; }
.mascot { display: block; width: 96px; height: 96px; margin: -6px auto -14px; pointer-events: none; }
.intro-pair .mascot { margin: 0; }
/* 마스코트 인형: 몸통은 숨 쉬듯 들썩이고 날개는 경첩(몸 쪽 끝)을 축으로 파닥인다 */
.rig { display: block; position: relative; }
.rig img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.rig .bw { position: absolute; inset: 0; transform-origin: 50% 96%; animation: breathe 2.2s ease-in-out infinite; }
.rig .wl { transform-origin: var(--wl); animation: flapL var(--flap, .34s) ease-in-out infinite alternate; }
.rig .wr { transform-origin: var(--wr); animation: flapR var(--flap, .34s) ease-in-out infinite alternate; }
.m-idle { --wl: 29% 59%; --wr: 73% 60%; }
.m-cheer { --wl: 28% 62%; --wr: 63% 74%; --flap: .16s; }
.m-cheer .bw { animation: cheerHop .7s cubic-bezier(.3, 0, .5, 1) infinite; }
.m-sad { --wl: 26% 55%; --wr: 68% 63%; --flap: 1.6s; }
.m-sad .bw { animation: sob 1.6s ease-in-out infinite; }
.m-sad .wl { animation-name: droopL; }
.m-sad .wr { animation-name: droopR; }
.m-point { --wl: 31% 70%; --wr: 66% 66%; --flap: .24s; }
.m-point .bw { transform-origin: 40% 96%; animation: pointNudge 1s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.03, .97); } }
@keyframes flapL { from { transform: rotate(-4deg); } to { transform: rotate(16deg) scaleX(.82); } }
@keyframes flapR { from { transform: rotate(4deg); } to { transform: rotate(-16deg) scaleX(.82); } }
@keyframes droopL { from { transform: rotate(-10deg); } to { transform: rotate(-2deg); } }
@keyframes droopR { from { transform: rotate(10deg); } to { transform: rotate(2deg); } }

/* 펠트 느낌: 털 결 무늬와 안쪽 바느질 선 */

/* 클리어: 회전하는 햇살, 튀어 오르는 팝이, 펼쳐지는 리본, 하나씩 박히는 별 */
/* 미리 만들어 둔 결과 창: 안 보이게, 움직임은 멈춰 두었다가 prep 을 떼면 처음부터 시작한다 */

.overlay.celebrate { background: radial-gradient(circle at 50% 45%, rgba(255, 170, 205, .55), rgba(40, 18, 52, .78) 70%); }

<script type="module">
  import { createSDK } from "https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js";
  const sdk = createSDK();
  const go = () => window.__platformGo();
  const game = () => window.FruityPop || {};
  // 리스너는 initializeAsync 전에
  sdk.on("pause", () => game().pause && game().pause());
  sdk.on("resume", () => game().resume && game().resume());
  sdk.on("exit", () => game().save && game().save());          // 동기 저장만 (0.5초 안)
  sdk.onBackPressed(() => {                                     // 동기. true = 게임이 창을 닫음
    try { return game().back ? game().back() === true : false; } catch (e) { return false; }
  });
  sdk.initializeAsync()
    .then(async (info) => {
      if (info.err) { go(); return; }                           // 그냥 브라우저: SDK 없이 플레이
      if (info.safeArea) {
        const st = document.documentElement.style;
        st.setProperty("--os-top", (info.safeArea.top || 0) + "px");
        st.setProperty("--os-bottom", (info.safeArea.bottom || 0) + "px");
      }
      sdk.setLoadingProgress(20);
      await window.__fpAssets;                                   // 그림을 다 불러오면
      sdk.setLoadingProgress(100);
      await sdk.startGameAsync();
      window.ONESTORE_SDK = sdk;
      const id = game().rewardId;
      if (id && sdk.ads.isSupported("rewarded")) sdk.ads.loadRewarded({ placementId: id });
      go();
    })
    .catch((e) => { console.error("ONE store SDK", e && e.reason, e && e.message); go(); });
</script>

// 새 장애물 안내. 글은 STR 의 in.<종류>.title/tag/text, 단계 그림이 있으면 in.<종류>.s0, s1 …
const INTROS = {};
for (const [k, steps] of Object.entries({ jelly: 0, ice: 0, choco: 0, box: 0, mer: 0, ing: 3, hive: 2, portal: 0, disp: 0, timer: 0 })) {
  INTROS[k] = {
    get title() { return T(`in.${k}.title`); },
    get tag() { return T(`in.${k}.tag`); },
    get text() { return T(`in.${k}.text`); },
    get steps() { return steps ? [...Array(steps)].map((_, i) => T(`in.${k}.s${i}`)) : null; },
  };
}
const comboWord = n => T('combo.' + Math.min(n, 6));

/* ---------- 저장 ---------- */
const SAVE_KEY = 'fruitypop.v3';
let save = { stars: {}, best: {}, last: 0, seen: {} };
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) save = Object.assign(save, JSON.parse(raw)); } catch (e) {}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  if (account) { clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 1500); }
}

  for (const k of new Set([...Object.keys(a.stars || {}), ...Object.keys(b.stars || {})])) out.stars[k] = Math.max(a.stars?.[k] || 0, b.stars?.[k] || 0);

  out.seenBoost = Object.assign({}, a.seenBoost, b.seenBoost);

const linear = t => t;

function tween(obj, to, dur, ease = easeOutCubic, delay = 0) {

function updateTweens(dt) {

    if (tw.t < 0) continue;

}

const BGM_VOL = .32;
const BGM = { on: true, want: null, tracks: {}, duck: 1 };
function bgmTrack(name) {
  if (!BGM.tracks[name]) {
    const mk = () => { const a = new Audio(`assets/music/${name}.mp3`); a.preload = 'auto'; a.volume = 0; return a; };
    BGM.tracks[name] = { a: [mk(), mk()], i: 0 };

}
function fadeTo(a, v, ms) {

  a._fade = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    a.volume = Math.max(0, Math.min(1, from + (v - from) * k));
    if (k >= 1) { clearInterval(a._fade); if (v === 0) a.pause(); }
  }, 40);
}
function setMusic(name) {
  if (name) BGM.want = name;
  if (SIM) return;
  for (const [n, t] of Object.entries(BGM.tracks)) {
    if (n !== BGM.want || !BGM.on) t.a.forEach(a => { if (!a.paused) fadeTo(a, 0, 700); });
  }
  if (!BGM.on || !BGM.want || !audio.ctx) return;
  const t = bgmTrack(BGM.want), a = t.a[t.i];
  if (a.paused) { if (a.ended || a.currentTime > a.duration - 4) a.currentTime = 0; a.play().catch(() => {}); }

}

  const a = t.a[t.i];

    const b = t.a[1 - t.i];
    b.currentTime = 0; b.volume = 0;

/* ---------- 매치 판정 ---------- */
function findRuns() {
  const runs = [];
  for (let r = 0; r < S.rows; r++) {
    let c = 0;
    while (c < S.cols) {
      const p = at(r, c);
      if (!p || p.color < 0) { c++; continue; }
      let e = c + 1;
      while (e < S.cols) { const q = at(r, e); if (q && q.color === p.color) e++; else break; }
      if (e - c >= 3) { const cells = []; for (let i = c; i < e; i++) cells.push([r, i]); runs.push({ dir: 'h', cells, color: p.color }); }
      c = e;
    }
  }
  for (let c = 0; c < S.cols; c++) {
    let r = 0;
    while (r < S.rows) {
      const p = at(r, c);
      if (!p || p.color < 0) { r++; continue; }
      let e = r + 1;
      while (e < S.rows) { const q = at(e, c); if (q && q.color === p.color) e++; else break; }
      if (e - r >= 3) { const cells = []; for (let i = r; i < e; i++) cells.push([i, c]); runs.push({ dir: 'v', cells, color: p.color }); }
      r = e;
    }
  }

}

  for (let r = 0; r < S.rows - 1; r++) for (let c = 0; c < S.cols - 1; c++) {
    const p = at(r, c); if (!p || p.color < 0) continue;
    if ([at(r, c + 1), at(r + 1, c), at(r + 1, c + 1)].every(q => q && q.color === p.color))

  }

}
function findGroups() {
  const items = findRuns().concat(findSquares());
  if (!items.length) return [];
  const parent = items.map((_, i) => i);
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  const owner = new Map();
  items.forEach((it, i) => it.cells.forEach(([r, c]) => {
    const k = key(r, c);
    if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k, i);
  }));
  const groups = new Map();
  items.forEach((it, i) => {
    const g = find(i);
    if (!groups.has(g)) groups.set(g, { runs: [], squares: 0, cells: new Map(), color: it.color });
    const G = groups.get(g);
    if (it.square) G.squares++; else G.runs.push(it);
    it.cells.forEach(([r, c]) => G.cells.set(key(r, c), [r, c]));

      const tp = S.grid[t[0]][t[1]];

      fx.push({ type: 'flyer', r, c, r2: t[0], c2: t[1], color: P.special === 'fly' ? P.color : Q.color, life: 0, max: 420 });
      initial.push(t);
    }
    bigWord(T(n > 1 ? 'bw.flock' : 'bw.deliver'), cell * .95);
    await wait(420);
    initial.push(a, b);
  } else if (isStripe(sp[0]) && isStripe(sp[1])) {
    bigWord(T('bw.cross'), cell * 1, '#c92c62');
    for (let i = 0; i < S.cols; i++) initial.push([r, i]);
    for (let i = 0; i < S.rows; i++) initial.push([i, c]);
    effects.push({ type: 'beam', dir: 'h', r, c, color: colorOf(P), thick: 1 }, { type: 'beam', dir: 'v', r, c, color: colorOf(Q), thick: 1 });
    fx.push({ type: 'ring', r, c, color: '#ffffff', size: 2.2, life: 0, max: 500 });
    shake(16); flash(.25);
    initial.push(a, b);
  } else if (sp.includes('wrap') && (isStripe(sp[0]) || isStripe(sp[1]))) {
    bigWord(T('bw.bigcross'), cell * 1.05, '#d96a00');
    for (let d = -1; d <= 1; d++) {
      for (let i = 0; i < S.cols; i++) initial.push([r + d, i]);
      for (let i = 0; i < S.rows; i++) initial.push([i, c + d]);
      effects.push({ type: 'beam', dir: 'h', r: r + d, c, color: colorOf(P), thick: 1 },
                   { type: 'beam', dir: 'v', r, c: c + d, color: colorOf(Q), thick: 1 });
    }
    fx.push({ type: 'rays', r, c, color: '#ffd23f', life: 0, max: 700 });
    shake(20); flash(.35);
    initial.push(a, b);
  } else {
    // 포장 + 포장: 5x5 대폭발이 두 번
    bigWord(T('bw.boom'), cell * 1.1, '#d96a00');
    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) initial.push([r + dr, c + dc]);
    effects.push({ type: 'ring', r, c, color: colorOf(P), size: 3.2 });
    fx.push({ type: 'rays', r, c, color: colorOf(Q), life: -150, max: 800 });
    fx.push({ type: 'ring', r, c, color: '#ffffff', size: 5, life: -320, max: 650 });
    setTimeout(() => { shake(24); flash(.3); }, 320);
    shake(22); flash(.4);
    initial.push(a, b);
  }
  await clearCells(initial, null, effects);
  await gravityAndRefill();
}

/* ---------- 턴 진행 ---------- */
function goalLeft(g) {
  switch (g.type) {
    case 'score': return Math.max(0, g.target - S.score);
    case 'collect': return Math.max(0, g.count - (S.collected[g.color] || 0));
    case 'jelly': return jellyLeft();
    case 'ice': return iceLeft();
    case 'choco': return chocoLeft();
    case 'box': return boxLeft() + S.boxOpening.size;
    case 'mer': return merLeft();
    case 'ing': return Math.max(0, S.ingTotal - S.ingGot);
    case 'honey': return Math.max(0, g.count - S.honeyGot);
  }
  return 0;
}
const goalsMet = () => S.level.goals.every(g => goalLeft(g) === 0);
function useMove() {
  S.moves--;
  updateHUD();
  const m = $('moves'); m.classList.remove('bump'); void m.offsetWidth; m.classList.add('bump');
}
async function attemptSwap(a, b, free = false) {
  if (S.busy || S.over) return;
  const pa = at(...a), pb = at(...b);
  if (!pa || !pb) return;
  if (pa.ice || pb.ice) { iceBump(pa.ice ? pa : pb); return; }
  S.busy = true; S.selected = null; S.hint = null; S.chocoHit = false;
  sfx.swap();
  await animSwap(a, b);
  let acted = true;
  if ((pa.special === 'bomb' || pb.special === 'bomb' || (pa.special && pb.special)) && !pa.ing && !pb.ing) {
    if (!free) useMove();
    await specialCombo(a, b);
    await resolve(null, 1);
  } else if (findGroups().length) {
    if (!free) useMove();
    await resolve([b, a]);
  } else if (free) {
    // 자유 교환은 맞지 않아도 바꾼 자리 그대로 둔다
  } else {
    acted = false;
    sfx.bad();
    shake(3);
    await animSwap(a, b);
  }
  await afterTurn(acted && !free);
  S.busy = false;
  S.hintAt = now + 5000;
}
function iceBump(p) {
  sfx.bad();
  p.sx = p.sy = 1.18;
  tween(p, { sx: 1, sy: 1 }, 260, easeOutBack);
  floatText(T('ft.ice'), cx(p.x), cy(p.y) - cell * .2, cell * .36, '#e6f8ff', '#2a6fb0');
}
// 이번 턴에 잼을 하나도 못 부쉈으면 한 칸 퍼진다
async function spreadChocolate() {
  if (S.chocoHit || !chocoLeft()) { S.chocoHit = false; return; }
  const cands = [];
  for (let r = 0; r < S.rows; r++) for (let c = 0; c < S.cols; c++) {
    if (!S.choco[r][c]) continue;
    for (const [dr, dc] of NEIGH) {
      const p = at(r + dr, c + dc);
      if (p && !p.special && !p.key && !p.ice && !p.ing && !p.timer) cands.push([r + dr, c + dc]);
    }
  }
  if (!cands.length) return;
  const [r, c] = cands[Math.floor(Math.random() * cands.length)];
  const p = S.grid[r][c];
  S.grid[r][c] = null;
  S.choco[r][c] = 1;
  popPiece(p, 0);
  const g = { s: .2 };
  S.grow.set(key(r, c), g);
  sfx.hammer();
  floatText(T('ft.jam'), cx(c), cy(r) - cell * .3, cell * .32, '#ffe7cf', '#5a2e14');
  await tween(g, { s: 1 }, 320, easeOutBack);
  S.grow.delete(key(r, c));
  updateHUD();
}
async function afterTurn(spread = false) {
  updateHUD();
  if (goalsMet()) {
    S.over = true;
    S.goalMoves = S.moves;
    mascotMood('cheer');
    sfx.goal();
    bigWord(T('bw.goal'));
    await wait(900);
    await bonusTime();
    return win();
  }
  if (S.moves <= 0) {
    S.over = true;
    await wait(350);
    return goalsMet() ? win() : lose();
  }
  if (spread && tickTimers()) {
    S.over = true;
    await wait(700);
    return lose('bomb');
  }
  if (spread) await spreadChocolate();
  if (S.moves === 5) bigWord(T('bw.five'), cell * .6);
  if (!findMove()) await shuffle();
}
// 시한폭탄 숫자를 하나씩 줄이고, 0이 된 게 있으면 터진다
function tickTimers() {
  let boom = null;
  forEachPiece((p, r, c) => {
    if (!p.timer) return;
    p.timer--;
    p.sx = p.sy = 1.15;
    tween(p, { sx: 1, sy: 1 }, 220, easeOutBack);
    if (p.timer <= 0 && !boom) boom = [r, c];
  });
  if (!boom) return false;
  const [r, c] = boom;
  fx.push({ type: 'boom', r, c, life: 0, max: 900 });
  shake(24); flash(.5);
  sfx.special('wrap_blast');
  bigWord(T('bw.pop'), cell * 1.1);
  return true;
}
async function bonusTime() {
  if (S.moves <= 0) return;
  bigWord(T('bw.bonus'));
  await wait(800);
  while (S.moves > 0) {
    const cands = [];
    forEachPiece((p, r, c) => { if (!p.special && p.color >= 0) cands.push([r, c]); });
    if (!cands.length) break;
    const [r, c] = cands[Math.floor(Math.random() * cands.length)];
    const p = S.grid[r][c];
    p.special = Math.random() < .5 ? 'h' : 'v';
    p.sx = p.sy = 1.5;
    tween(p, { sx: 1, sy: 1 }, 260, easeOutBack);
    burst(cx(c), cy(r), '#ffe27a', 10);
    S.moves--;
    S.score += 300;
    updateHUD();
    sfx.create();
    await wait(110);
  }
  // 한꺼번에 터뜨리면 빔이 화면을 덮어 번쩍번쩍 깜빡였다 → 세 개씩 차례로, 번쩍임 없이 터뜨린다
  S.bonusing = true;
  for (let i = 0; i < 30; i++) {
    const sp = [];
    forEachPiece((p, r, c) => { if (p.special) sp.push([r, c]); });
    if (!sp.length) break;
    S.combo = 1;
    await clearCells(sp.sort(() => Math.random() - .5).slice(0, 3), null);
    await gravityAndRefill();
    await resolve(null, 1);
  }
  S.bonusing = false;
}
async function shuffle(fromBooster = false) {
  bigWord(T(fromBooster ? 'bw.spin' : 'bw.shuffle'), cell * .7);
  sfx.shuffle();
  if (!fromBooster) await wait(600);
  const cells = [];
  forEachPiece((p, r, c) => { if (!p.ice && !p.ing) cells.push([r, c]); });
  const pieces = cells.map(([r, c]) => S.grid[r][c]);
  let ok = false;
  for (let t = 0; t < 200 && !ok; t++) {
    for (let i = pieces.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pieces[i], pieces[j]] = [pieces[j], pieces[i]]; }
    cells.forEach(([r, c], i) => S.grid[r][c] = pieces[i]);
    ok = !findGroups().length && !!findMove();
  }
  for (let t = 0; t < 200 && !ok; t++) {
    cells.forEach(([r, c]) => { const p = S.grid[r][c]; if (!p.special) p.color = randColor(); });
    ok = !findGroups().length && !!findMove();
  }
  // 과일들이 가운데로 빨려 들어가 소용돌이친 뒤 새 자리로 흩어진다
  const mx = (S.cols - 1) / 2, my = (S.rows - 1) / 2;
  fx.push({ type: 'swirl', life: 0, max: 1000 });
  await Promise.all(cells.map(([r, c], i) => {
    const a = i / cells.length * Math.PI * 2, rad = 1 + (i % 3) * .55;
    return tween(S.grid[r][c], { x: mx + Math.cos(a) * rad, y: my + Math.sin(a) * rad, sx: .7, sy: .7 }, 380, easeInOutQuad);
  }));
  await Promise.all(cells.map(([r, c], i) => tween(S.grid[r][c], { x: c, y: r, sx: 1, sy: 1 }, 480, easeOutBack, (i % 8) * 12)));
}
// 자유 교환: 장갑이 첫 칸에서 둘째 칸으로 과일을 옮긴다
function gloveSwap(a, b) {
  fx.push({ type: 'glove', r: a[0], c: a[1], r2: b[0], c2: b[1], life: 0, max: 420 });
  floatText(T('ft.swish'), cx((a[1] + b[1]) / 2), cy((a[0] + b[0]) / 2) - cell * .5, cell * .45, '#ffffff', '#3a86ff');
  for (let i = 0; i < 10; i++) setTimeout(() => {
    const t = i / 10;
    burst(cx(a[1] + (b[1] - a[1]) * t), cy(a[0] + (b[0] - a[0]) * t), '#bfe6ff', 3, .6);
  }, i * 30);
}
async function win() {
  if (SIM) { S.result = 'win'; return; }
  const stars = Math.max(1, S.level.stars.filter(s => S.score >= s).length);
  const i = S.levelIdx;
  const prevBest = save.best[i] || 0, prevStars = save.stars[i] || 0;
  save.stars[i] = Math.max(prevStars, stars);
  mapAnim = { from: i, before: prevStars, after: save.stars[i] };
  save.best[i] = Math.max(prevBest, S.score);
  persist();
  track('level_win', { level: i + 1, stars, score: S.score, moves_left: S.goalMoves ?? S.moves,
    attempt: save.tries?.[i] || 1, boosters_used: S.boostUsed });
  sfx.win();
  duckMusic(3500);
  // 결과 창은 미리 만들어 숨겨 둔다(그림·글자 배치를 이때 끝낸다). 0.8초 뒤에는 보이기만 해서 뜨는 순간 끊기지 않는다
  const last = i === LEVELS.length - 1;
  showOverlay(`
    <div class="panel" role="dialog" aria-labelledby="ovTitle">
      <p class="eyebrow">${T('lv.n', { n: i + 1 })} · ${levelTitle(i)}</p>
      <img class="mascot" src="assets/mascot_cheer.png" alt="">${/* 날개·몸이 따로 움직이는 팝이는 이 창에서 무거워서 한 장짜리 그림이 통통 뛰게만 한다 */ ''}
      <h2 id="ovTitle">${T(last ? 'win.all' : 'win.clear')}</h2>
      <div class="stars" aria-label="${T('stars.n', { n: stars })}">${[0, 1, 2].map(k => `<span class="${k < stars ? 'on' : ''}"></span>`).join('')}</div>
      <p class="final">${pts(S.score)}</p>
      <p class="sub">${S.score > prevBest ? `<span class="record">${T('win.record')}</span>` : T('win.best', { n: pts(prevBest) })}</p>
      <div class="row">
        <button type="button" data-act="retry">${T('btn.retry')}</button>
        <button type="button" data-act="map">${T('btn.map')}</button>
        ${last ? '' : `<button type="button" class="primary" data-act="next">${T('btn.next')}</button>`}
      </div>
    </div>`);
  overlay.classList.add('celebrate', 'prep');
  await wait(800);
  if (!overlay.classList.contains('prep')) return;
  overlay.classList.remove('prep');
  celebrate(stars);
}
// 앱을 켜고 처음 뜨는 클리어 화면이 크게 끊겼다(GPU 가 그라데이션·글자·테두리 그림을 처음 준비하느라 130ms 남짓).
// 그래서 첫 판을 시작할 때 같은 모양의 창을 거의 투명하게 잠깐 그려 두어 준비를 미리 끝낸다
function prewarmResult() {
  if (prewarmResult.done || SIM) return;
  prewarmResult.done = true;
  const d = document.createElement('div');
  d.className = 'overlay celebrate';
  d.setAttribute('aria-hidden', 'true');

  d.innerHTML = `

      <p class="sub"><span class="record">${T('win.record')}</span></p>

// 클리어 연출: 별마다 반짝 터지는 소리와 파편, 점수 올라가기, 화면 위에서 쏟아지는 색종이
function celebrate(stars) {
  fxCanvas.style.zIndex = 12;
  for (let k = 0; k < stars; k++) setTimeout(() => {
    if (overlay.hidden) return;
    play('create_special', 1 + k * .06, .9, 0);
    if (k === 2) flash(.25);
  }, 650 + k * 300);
  // 결과 창에서는 파편·색종이를 뿌리지 않는다 (120Hz 폰에서 프레임이 떨어졌다). 별은 CSS 로만 팡 박힌다
  const el = overlay.querySelector('.final'), target = S.score, t0 = performance.now() + 400;
  let lastTick = 0;
  const count = () => {
    if (overlay.hidden) return;
    const now2 = performance.now(), q = Math.min(1, Math.max(0, (now2 - t0) / 1000));
    if (q >= 1 || now2 - (count.at || 0) > 50) { count.at = now2; el.textContent = pts(target * easeOutCubic(q)); }
    if (q > 0 && q < 1 && now2 - lastTick > 160) { lastTick = now2; play('tick', 1, .35, 0); }
    if (q < 1) requestAnimationFrame(count);
  };
  el.textContent = pts(0);
  requestAnimationFrame(count);
}
async function lose(reason) {
  if (SIM) { S.result = 'lose'; return; }
  track('level_fail', { level: S.levelIdx + 1, reason: reason === 'bomb' ? 'bomb' : 'moves', progress: goalProgress(),
    score: S.score, attempt: save.tries?.[S.levelIdx] || 1, boosters_used: S.boostUsed });
  sfx.lose();
  duckMusic(3000);
  mascotMood('sad');
  await wait(500);
  const summary = S.level.goals.map(g =>
    `<span class="goal${goalLeft(g) === 0 ? ' done' : ''}">${goalLabel(g)} ${goalText(g)}</span>`).join('');
  showOverlay(`
    <div class="panel" role="dialog" aria-labelledby="ovTitle">
      <p class="eyebrow">${T('lv.n', { n: S.levelIdx + 1 })} · ${levelTitle(S.levelIdx)}</p>
      ${mascotRig('sad')}
      <h2 id="ovTitle">${T('lose.title')}</h2>
      <p class="sub">${T(reason === 'bomb' ? 'lose.bomb' : 'lose.moves')}</p>
      <div class="goal-summary">${summary}</div>
      <p class="final">${pts(S.score)}</p>
      <div class="row">
        ${reason !== 'bomb' && !S.adContinue && adAvailable() ? `<button type="button" class="primary ad-btn" data-act="ad-continue">${T('ad.continue')}</button>` : ''}
        <button type="button" data-act="map">${T('btn.map')}</button>
        <button type="button" class="primary" data-act="retry">${T('btn.retry')}</button>
      </div>
    </div>`);
  overlay.classList.add('gloomy');
}

/* ---------- 마스코트 팝이 ---------- */
let moodTimer = 0;
// 몸통과 양 날개를 따로 겹쳐 그려 날개가 파닥이게 한다 (눈꺼풀이 가끔 깜빡이고, 슬플 때는 눈물도 떨어진다)
function rigParts(mood) {
  return `<img class="wing wl" src="assets/mascot_${mood}_wl.png" alt=""><img class="wing wr" src="assets/mascot_${mood}_wr.png" alt="">`
    + `<span class="bw"><img class="body" src="assets/mascot_${mood}_body.png" alt="">`
    + (mood === 'cheer' ? '' : '<i class="lid l1"></i><i class="lid l2"></i>')
    + (mood === 'sad' ? '<i class="tear t1"></i><i class="tear t2"></i>' : '') + '</span>';
}
function mascotRig(mood, cls = 'mascot', style = '') {
  return `<span class="${cls} rig m-${mood}" aria-hidden="true"${style ? ` style="${style}"` : ''}>${rigParts(mood)}</span>`;
}
function setRig(el, mood) { el.className = `rig m-${mood}`; el.innerHTML = rigParts(mood); }
function mascotMood(mood, ms = 0) {
  const el = $('mascot'); if (!el) return;
  clearTimeout(moodTimer);
  setRig(el, mood);
  if (ms) moodTimer = setTimeout(() => setRig(el, 'idle'), ms);
}

/* ---------- HUD ---------- */
function goalLabel(g) {
  if (g.type === 'collect') return T('fruit.' + g.color);
  return T('goal.' + g.type);
}
function goalText(g) {
  const left = goalLeft(g);
  if (g.type === 'score') return pts(g.target);
  if (g.type === 'collect') return (g.count - left) + '/' + g.count;
  return T('goal.left', { n: left });
}
function drawGoalIcon(g2, px, type, color) {
  if (type === 'collect') drawCandy(g2, px, color, null);
  else if (type === 'jelly') drawJellyIcon(g2, px);
  else if (type === 'ice') { drawCandy(g2, px, 4, null); drawIce(g2, 0, 0, px, 2); }
  else if (type === 'choco') drawChoco(g2, 0, 0, px, 1);
  else if (type === 'box') drawBox(g2, 0, 0, px);
  else if (type === 'mer') drawMer(g2, 0, 0, px, 3);
  else if (type === 'ing') drawIng(g2, px / 2, px / 2, px, 'egg1');
  else if (type === 'honey' && XIMG.honey) g2.drawImage(XIMG.honey, 0, 0, px, px);
}
let goalEls = [], tickEls = [];
function buildGoals() {
  const box = $('goals');
  box.innerHTML = '';
  goalEls = S.level.goals.map(g => {
    const el = document.createElement('span');
    el.className = 'goal';
    if (g.type !== 'score') {
      const ic = document.createElement('canvas');
      const px = Math.round(28 * dpr);
      ic.width = ic.height = px;
      const g2 = ic.getContext('2d');
      drawGoalIcon(g2, px, g.type, g.color);
      ic.setAttribute('aria-hidden', 'true');
      el.appendChild(ic);
    }
    const t = document.createElement('span');
    el.appendChild(t);
    el.setAttribute('title', goalLabel(g));
    box.appendChild(el);
    return { g, el, t };
  });
  const bar = $('bar');
  tickEls.forEach(t => t.remove());
  tickEls = S.level.stars.map(s => {
    const t = document.createElement('span');
    t.className = 'tick';
    t.style.left = (s / S.level.stars[2] * 100) + '%';
    bar.appendChild(t);
    return t;
  });
}
function updateHUD() {
  $('levelNum').textContent = S.levelIdx + 1;
  $('levelName').textContent = levelTitle(S.levelIdx);
  $('moves').textContent = Math.max(0, S.moves);
  $('movesCard').classList.toggle('low', S.moves <= 5 && !S.over);
  $('score').textContent = pts(S.score);
  $('barFill').style.width = Math.min(100, S.score / S.level.stars[2] * 100) + '%';
  tickEls.forEach((t, i) => t.classList.toggle('on', S.score >= S.level.stars[i]));
  for (const { g, el, t } of goalEls) {
    t.textContent = goalText(g);
    el.classList.toggle('done', goalLeft(g) === 0);

function layout() {
  render.still = false;   // 캔버스 크기가 바뀌면 판을 다시 그린다
  dpr = Math.min(LOW_FX ? 2 : 2.5, window.devicePixelRatio || 1);
  const vw = document.documentElement.clientWidth;
  const availW = Math.min(580, vw - 32);
  const app = $('app');
  const chrome = [...app.children].reduce((s, el) => s + (el.classList.contains('board-wrap') ? 0 : el.offsetHeight), 0)
    + (app.children.length - 1) * 10 + 32;
  const availH = Math.max(320, window.innerHeight - chrome - 8);
  cell = Math.floor(Math.max(32, Math.min(availW / (S.cols + .5), availH / (S.rows + .5), 68)));
  pad = Math.round(cell * .25);
  W = S.cols * cell + pad * 2;
  H = S.rows * cell + pad * 2;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  document.documentElement.style.setProperty('--bw', W + 'px');
  fxW = window.innerWidth; fxH = window.innerHeight;
  fxDpr = LOW_FX ? Math.min(1.5, dpr) : dpr;
  fxCanvas.width = Math.round(fxW * fxDpr); fxCanvas.height = Math.round(fxH * fxDpr);

}
function buildBoardLayer() {
  const c = document.createElement('canvas');
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const cells = [];
  for (let r = 0; r < S.rows; r++) for (let k = 0; k < S.cols; k++) if (S.mask[r][k]) cells.push([r, k]);
  const rim = tok('--board-rim'), board = tok('--board'), ta = tok('--tile-a'), tb = tok('--tile-b');
  g.fillStyle = rim;
  cells.forEach(([r, k]) => { roundRectPath(g, pad + k * cell - pad * .75, pad + r * cell - pad * .75, cell + pad * 1.5, cell + pad * 1.5, pad * 1.1); g.fill(); });
  g.fillStyle = board;
  cells.forEach(([r, k]) => { roundRectPath(g, pad + k * cell - pad * .4, pad + r * cell - pad * .4, cell + pad * .8, cell + pad * .8, pad * .8); g.fill(); });
  cells.forEach(([r, k]) => {
    g.fillStyle = (r + k) % 2 ? ta : tb;
    roundRectPath(g, pad + k * cell + 1.5, pad + r * cell + 1.5, cell - 3, cell - 3, cell * .16);
    g.fill();
  });
  boardLayer = c;
  clipPath = new Path2D();
  cells.forEach(([r, k]) => clipPath.rect(pad + k * cell, pad + r * cell, cell, cell));
}

    b.classList.remove('tapped'); void b.offsetWidth; b.classList.add('tapped');
  }
  else if (act === 'link-google') {
    b.disabled = true;
    linkGoogle().then(() => showOverlay(optionsHTML()), e => { b.disabled = false; b.textContent = loginError(e); });
  } else if (act === 'sign-out') signOut();
  else if (act === 'del-ask') askDeleteAccount();

  }
  else if (act === 'intro') { hideOverlay(); const done = S.introDone; S.introDone = null; if (done) done(); }
});

/* ---------- 뒤로가기 (안드로이드 앱) ---------- */
// 아무것도 안 붙이면 한 번에 앱이 꺼진다. 다른 게임(지우개 셈)과 같이 두 단계로 받는다:
// 1) 떠 있는 창이 있으면 맨 위 하나만 닫고, 판 화면이면 설정 창(일시 정지)을 연다
// 2) 지도·시작 화면에서 닫을 게 없으면 끌지 묻는다
function backPop() {
  if (!overlay.hidden) {
    // 도움말은 설정으로 돌아가고, 결과 창은 지도로, 안내 창은 확인으로 닫는다

    if (b) b.click();
    return true;

  return false;
}
function askExit() {
  showOverlay(`
    <div class="panel" role="dialog" aria-labelledby="ovTitle">

}
if (NATIVE) Capacitor.Plugins.App.addListener('backButton', () => { if (!backPop()) askExit(); });
// 지도에서 아무 곳이나 처음 눌러도 음악이 시작되게 한다
$('map').addEventListener('pointerdown', () => initAudio(), { once: true });
$('mapPath').addEventListener('click', e => {
  const b = e.target.closest('.node');
  if (!b || b.classList.contains('locked') || mapBusy) return;
  initAudio();

});
let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (!$('map').hidden) showMap(); else if (S.mask.length) { layout(); buildGoals(); updateHUD(); } }, 120);
});

/* ---------- 레벨 시작 ---------- */
async function startLevel(i) {
  mapAnim = null;
  tweens = []; fx = []; particles = []; texts = []; dying = [];
  flashAmt = 0; shakeAmt = 0;
  $('map').hidden = true;
  $('app').hidden = false;
  mascotMood('idle');
  setMusic('game');
  S.boxOpening = new Set(); S.grow = new Map(); S.chocoHit = false; S.result = null; S.bonusing = false;
  S.levelIdx = Math.max(0, Math.min(LEVELS.length - 1, i | 0));
  S.level = LEVELS[S.levelIdx];
  setZoneBg(zoneAt(S.levelIdx));
  parseLayout(S.level.layout);
  S.moves = S.level.moves; S.score = 0; S.collected = {}; S.combo = 0;
  S.over = false; S.selected = null; S.hint = null;
  S.boostLeft = {};
  for (const k in BOOSTERS) S.boostLeft[k] = boosterOpen(k) ? BOOSTERS[k].start : 0;
  setBoost(null);
  S.jellyTotal = jellyLeft();
  outer: for (let r = 0; r < S.rows; r++) for (let c = 0; c < S.cols; c++) if (S.mask[r][c]) { S.cursor = [r, c]; break outer; }
  hideOverlay();
  layout();
  fillBoard();
  buildGoals();
  updateHUD();
  S.goalStart = S.level.goals.map(goalLeft);
  S.boostUsed = 0;
  S.adContinue = false; S.adBoost = false;
  updateBoosters();
  save.last = S.levelIdx;
  save.tries = save.tries || {};
  save.tries[S.levelIdx] = (save.tries[S.levelIdx] || 0) + 1;
  persist();
  track('level_start', { level: S.levelIdx + 1, attempt: save.tries[S.levelIdx] });
  S.busy = true;
  const anims = [];
  let landed = 0, lastPlop = 0;
  const total = countPieces(() => true);
  const plop = () => {
    landed++;
    const t = performance.now();
    if (t - lastPlop < 40) return;
    lastPlop = t;
    sfx.land(.94 + landed / total * .16, .5);
  };
  forEachPiece((p, r, c) => { p.y = r - S.rows - 1; anims.push(fall(p, r, reduceMotion ? 0 : c * 35 + (S.rows - 1 - r) * 22, plop)); });
  await Promise.all(anims);
  if (!SIM) { sfx.levelStart(); burst(W / 2, H / 2, '#ffe27a', 16, 1.2); prewarmResult(); }
  save.seenBoost = save.seenBoost || {};
  for (const k in BOOSTERS) {
    if (SIM || BOOSTERS[k].unlock !== S.levelIdx + 1 || save.seenBoost[k]) continue;
    await showBoosterUnlock(k);
    save.seenBoost[k] = true;
    persist();
  }
  const intro = S.level.intro;
  if (intro && !SIM && !save.seen[intro]) {
    await showIntro(intro);
    save.seen[intro] = true;
    persist();
  }
  S.busy = false;
  S.hintAt = now + 6000;
  bigWord(S.level.name, cell * .75);
}

function boot(data) {
  if (save.musicOff) setMusicOn(false);
  if (save.sfxOff) audio.on = false;
  window.claude?.hot?.snapshot?.(() => ({ level: S.levelIdx }));
  if (SIM) startLevel(0);
  else if (Number.isInteger(data && data.level)) startLevel(data.level);
  else if (NATIVE) { authGate().then(() => showMap()); checkUpdate(); }
  else showMap();
  requestAnimationFrame(t => { last = t; frame(t); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if ($('map').hidden && S.mask.length) { layout(); buildGoals(); updateHUD(); } });
}
if (SIM) {
  const goalColors = () => new Set(S.level.goals.filter(g => g.type === 'collect').map(g => g.color));
  function evalMove([a, b]) {
    const p = at(...a), q = at(...b);
    if (p.special === 'bomb' || q.special === 'bomb' || (p.special && q.special)) return 40 + Math.random();
    S.grid[a[0]][a[1]] = q; S.grid[b[0]][b[1]] = p;
    const groups = findGroups(), want = goalColors();
    let v = 0;
    for (const G of groups) {
      v += G.cells.size;
      const sp = groupSpecial(G);
      if (sp) v += sp === 'bomb' ? 14 : sp === 'wrap' ? 9 : sp === 'fly' ? 7 : 6;
      if (want.has(G.color)) v += G.cells.size;
      for (const [, [r, c]] of G.cells) {
        const x = S.grid[r][c];
        v += S.jelly[r][c] * 2 + (x.ice ? 3 : 0) + (x.key ? 6 : 0) + (x.timer ? (x.timer <= 3 ? 14 : 4) : 0);
        for (const [dr, dc] of NEIGH) if (playable(r + dr, c + dc) && (S.choco[r + dr][c + dc] || S.mer[r + dr][c + dc])) v += 3;
        for (const [dr, dc] of NEIGH) if (playable(r + dr, c + dc) && S.hive[r + dr][c + dc]) v += 4;
        // 재료 바로 아래가 터지면 재료가 내려온다
        for (let rr = r - 1; rr >= 0; rr--) { const up = at(rr, c); if (!up) break; if (up.ing) { v += 5; break; } }
        // 포털 출구가 비면 들어가는 쪽 줄의 재료가 건너온다
        for (const P of S.portals) if (P.r2 === r && P.c2 === c)
          for (let rr = P.r1; rr >= 0; rr--) { const up = at(rr, P.c1); if (!up) break; if (up.ing) { v += 5; break; } }
      }
    }
    S.grid[a[0]][a[1]] = p; S.grid[b[0]][b[1]] = q;
    return v + Math.random();
  }
  window.__levels = LEVELS;
  window.__sim = async (lv, runs, strategy) => {
    const out = [];
    for (let n = 0; n < runs; n++) {
      await startLevel(lv);
      let guard = 0;
      while (!S.over && guard++ < 300) {
        const moves = allMoves();
        if (!moves.length) { await shuffle(); continue; }
        const mv = strategy === 'greedy'
          ? moves.reduce((best, m) => { const v = evalMove(m); return v > best.v ? { m, v } : best; }, { v: -1 }).m
          : moves[Math.floor(Math.random() * moves.length)];
        await attemptSwap(mv[0], mv[1]);
      }
      out.push({ win: S.result === 'win', score: S.score, left: S.goalMoves ?? S.moves, ing: S.ingGot, eggs: (() => { const e = []; forEachPiece((p, r, c) => { if (p.ing) e.push(r + ',' + c); }); return e.join(' '); })(), mer: merLeft() });
      S.goalMoves = null;
      await new Promise(r => setTimeout(r, 0));
    }
    return out;
  };
}
// 테스트 모드에서만: 콘솔에서 sugarTest.win() / sugarTest.lose() 로 결과 화면을 바로 띄운다
if (TEST || SHOT) window.sugarTest = {
  win(score = S.level.stars[2] + 1000) { S.over = true; S.score = score; updateHUD(); return win(); },
  lose() { S.over = true; return lose(); },
  // 앱 시작 화면 모양만 본다 (웹에서는 버튼을 눌러도 로그인되지 않는다)
  login() { showLogin(); },
  // 업데이트 띠 모양만 본다
  update() { showUpdateBand(); },
  // 안드로이드 뒤로가기 버튼을 누른 것처럼 한다
  back() { if (!backPop()) askExit(); },
  // 목표를 채운 뒤의 보너스 타임만 돌려 본다 (남은 이동 n번)
  async bonus(n = 12) { S.over = true; S.moves = n; updateHUD(); await bonusTime(); },
  // 스크린샷용: 레벨 시작, 지도에서 그 레벨로 스크롤, 장애물 안내 창
  start(i) { return startLevel(i); },
  mapAt(i) {
    showMap();
    // showMap 이 다음 프레임에 현재 레벨로 스크롤하므로, 그 뒤에 원하는 레벨로 옮긴다
    return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelector(`[data-lv="${i}"]`)?.scrollIntoView({ block: 'center' });
      mapZoneCheck(); r();
    })));
  },
  intro(kind) { showIntro(kind); },
  // 첫 번째 벌집 바로 옆 칸을 터뜨려 꿀방울이 날아가는 연출을 본다
  async hive() {
    let hit = null;
    forEachPiece((q, r, c) => { if (!hit && NEIGH.some(([dr, dc]) => playable(r + dr, c + dc) && S.hive[r + dr][c + dc])) hit = [r, c]; });
    if (!hit) return 'no hive';
    S.busy = true;
    await clearCells([hit], null);
    updateHUD();
    await gravityAndRefill();
    S.busy = false;
  },
  // 병아리 알 하나를 둥지 칸에 놓고 깨어나는 연출을 본다
  async hatch(c = 3) {
    const r = exitRow(c);
    S.ingTotal = Math.max(S.ingTotal, S.ingGot + 1);
    S.grid[r][c] = makeIng(r, c);
    await wait(500);
    await deliverIngredients();
    await gravityAndRefill();
  },
  // 터뜨리지 않고 특수 과일 모양만 깔아 본다 (그림 확인용)
  dress(kinds = ['h', 'v', 'wrap', 'fly', 'bomb']) {
    let i = 0;
    forEachPiece(q => {
      if (q.special || q.color < 0 || Math.random() < .6) return;
      const k = kinds[i++ % kinds.length];
      q.special = k; if (k === 'bomb') q.color = -1;
    });
  },
  special(kind = 'h') {
    const cands = [];
    forEachPiece((q, r, c) => { if (!q.special && q.color >= 0 && r > 1 && r < S.rows - 2 && c > 1 && c < S.cols - 2) cands.push([r, c]); });
    const [r, c] = cands[Math.floor(Math.random() * cands.length)];
    const q = S.grid[r][c];
    q.special = kind; if (kind === 'bomb') q.color = -1;
    S.busy = true; S.combo = 1;
    clearCells([[r, c]], null).then(() => gravityAndRefill()).then(() => resolve(null, 1)).then(() => { S.busy = false; });
  },
  fuse(k1 = 'h', k2 = 'wrap') {
    let pos = null;
    forEachPiece((q, r, c) => { if (!pos && r > 2 && r < S.rows - 3 && c > 2 && c < S.cols - 3 && at(r, c + 1)) pos = [r, c]; });
    const [r, c] = pos, A = S.grid[r][c], B = S.grid[r][c + 1];
    A.special = k1; B.special = k2;
    if (k1 === 'bomb') A.color = -1;
    if (k2 === 'bomb') B.color = -1;
    S.busy = false;
    attemptSwap([r, c], [r, c + 1]);
  },
  combo(n = 7) {
    for (let i = 2; i <= n; i++) setTimeout(() => {
      bigWord(comboWord(i), cell * (.7 + Math.min(.45, i * .07)),
        i >= 6 ? '#7a3bd0' : i >= 4 ? '#d96a00' : '#c92c62');
      comboFx(i);
    }, (i - 2) * 500);
  },
};
// 결과·안내 창 그림을 미리 풀어 둔다. 처음 클리어 화면이 뜰 때 이 그림들을 푸느라 한 프레임 끊겼다
const warmImages = [];
function warmUp() {
  const names = ['star_on', 'star_off', 'ribbon', 'pill_yellow', 'pill_pink', 'pill_white', 'mascot_cheer',
    ...['cheer', 'sad', 'idle', 'point'].flatMap(m => [`mascot_${m}_body`, `mascot_${m}_wl`, `mascot_${m}_wr`])];
  for (const n of names) {
    const im = new Image();
    im.src = `assets/${n}.png`;
    if (im.decode) im.decode().catch(() => {});
    warmImages.push(im);
  }
}
// 원스토어 웹게임판은 SDK 가 init → 로딩 → start 를 마칠 때까지(window.__platformReady) 기다린다.
// 그림을 다 불러오면 window.__fpAssets 로 알려 로딩 진행률을 채운다. 다른 판에서는 둘 다 바로 지나간다
const assetsReady = loadImages();
window.__fpAssets = assetsReady;
const bootWithImages = data => Promise.all([assetsReady, window.__platformReady]).then(() => { boot(data); setTimeout(warmUp, 1200); });
// 원스토어판이 일시정지·재개·종료 저장·뒤로가기를 게임에 전할 때 쓴다
window.FruityPop = {
  pause() { BGM.duck = 0; setMusic(); if (audio.ctx) audio.ctx.suspend().catch(() => {}); },
  resume() { BGM.duck = 1; setMusic(); if (audio.ctx) audio.ctx.resume().catch(() => {}); },
  save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} },
  back: () => backPop(),
  rewardId: OS_REWARD_ID,
};
window.claude?.hot?.ready ? window.claude.hot.ready(bootWithImages) : bootWithImages(window.claude?.hot?.data ?? {});
})();
</script>
