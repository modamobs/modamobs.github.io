  <title>로켓 탈출</title>

  <script>window.rocketOneStoreReady = new Promise((r) => { window.__rocketOneStoreResolve = r; });</script>
<script type="module">
// 원스토어 웹게임 다리 (2026-10-24). tool/build_onestore.py 가 index.html <head> 에 끼운다 (모듈 스크립트).
// 원스토어 H5 Game SDK (https://onestore-dev.gitbook.io/dev/tools/web-sdk) 를 플러터보다 먼저 읽고,
// 다트는 window.rocketOneStore 하나만 본다 (lib/onestore/onestore_bridge_web.dart).
//
// 모듈 스크립트는 문서를 다 읽은 뒤에 돌아서 플러터(async)가 먼저 깰 수 있다 — 그래서 build_onestore.py 가
// 이 앞에 보통 스크립트로 window.rocketOneStoreReady (Promise) 를 먼저 만들어 두고, 여기서 다리를 다 꾸린 뒤 푼다.
//
// 보상형 광고: 원스토어는 SSV(서버 확인 → 우리 서버 postback) 로 보상을 확정하라고 권하지만, 이 게임의 보상은
// 게임 안 연료뿐이라 기기에서 rewarded 결과로 준다 (토스판과 같다). 서버 콜백은 함수 onestoreAdCallback 이 받아 기록만 한다. 광고 번호(placementId)는 ONEconsole
// 수익화 > 인앱 광고 에서 받아 아래 REWARDED_ID 에 넣는다 — 비어 있으면 광고를 안 붙이고 무료 보급으로 돈다.
import { createSDK } from 'https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js';

const REWARDED_ID = 'x7SCK-BAF5-R4FE-JQZ8'; // ONEconsole 수익화 > 인앱 광고 리워드 비디오 상용 ID (2026-10-28 발급). 전면 광고 ID 는 전면을 꺼 둬서 안 쓴다

const sdk = createSDK();
const listeners = { pause: [], resume: [], exit: [] };
const fire = (name, arg) => {
  for (const fn of listeners[name]) {
    try {
      fn(arg);
    } catch (e) {
      console.error('rocketOneStore', name, e);
    }
  }
};

// 리스너는 initializeAsync 전에 (초기화 직후 이벤트가 연달아 온다)
sdk.on('pause', (e) => fire('pause', (e && e.reason) || ''));
sdk.on('resume', (e) => fire('resume', e && typeof e.ringerSilent === 'boolean' ? String(e.ringerSilent) : ''));
// 저장만 (0.5초 안에, 동기로). quit() 은 다시 부르지 않는다
sdk.on('exit', () => fire('exit'));
// 뒤로가기: 게임이 닫을 창을 따로 들고 있지 않아 앱의 종료 확인 창으로 넘긴다 (동기 함수여야 한다)
sdk.onBackPressed(() => false);

// 원스토어 앱 밖(일반 브라우저)이면 err 로 풀린다 — 그때도 게임은 그대로 돈다
const init = sdk
  .initializeAsync()
  .then((info) => (info.err ? { ok: false, err: String(info.err) } : { ok: true, playerId: info.playerId || '', ringerSilent: !!info.ringerSilent }))
  .catch((e) => ({ ok: false, err: (e && e.reason) || 'error' }));

let started = false;
const adsReady = () => {
  if (!started || !REWARDED_ID) return false;
  try {
    return sdk.ads.isSupported('rewarded');
  } catch {
    return false;
  }
};

window.rocketOneStore = {
  /** {"ok":true,"playerId":…} 또는 {"ok":false,"err":…} JSON 글 */
  init: () => init.then((r) => JSON.stringify(r)),
  /** 불러오기 진행 0~100 */
  progress: (p) => {
    try {
      sdk.setLoadingProgress(Math.max(0, Math.min(100, Math.round(p))));
    } catch {}
  },
  /** 첫 화면이 떴을 때. 성공하면 보상형 광고를 미리 불러 둔다 */
  start: () =>
    init.then((r) => {
      if (!r.ok) return false;
      try {
        sdk.setLoadingProgress(100);
      } catch {}
      return sdk
        .startGameAsync()
        .then(() => {
          started = true;
          if (adsReady()) sdk.ads.loadRewarded({ placementId: REWARDED_ID });
          return true;
        })
        .catch((e) => {
          console.error('startGameAsync', e && e.reason);
          return false;
        });
    }),
  adsReady,
  /** 보상형 광고. 끝까지 봤으면 true (dismissed·failed·no_fill 은 false) */
  showRewarded: async () => {
    if (!adsReady()) return false;
    const requestId = 'rocket-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
    const r = await sdk.ads.showRewardedAsync({ placementId: REWARDED_ID, requestId });
    if (r.status !== 'rewarded') console.warn('rewarded', r.status, r.reason);
    // 다음 편을 미리
    setTimeout(() => {
      try {
        sdk.ads.loadRewarded({ placementId: REWARDED_ID });
      } catch {}
    }, 0);
    return r.status === 'rewarded';
  },
  onPause: (fn) => listeners.pause.push(fn),
  onResume: (fn) => listeners.resume.push(fn),
  onExit: (fn) => listeners.exit.push(fn),
};
window.__rocketOneStoreResolve && window.__rocketOneStoreResolve(true);

</script>
<script>(() => {
/**
 * 토스판 단 분리 고스트 레이스 (2026-10-19 사용자 "토스도"): Firebase SDK 없이 REST 로 서버에 닿는다.
 * 토스 자동 검수가 Firebase 웹 SDK(외부 코드)를 거르고, gstatic 에서 받아 실행하는 코드는 웹뷰에서 막히면 흰 화면이라
 * fetch 만 쓴다 (~/.claude/docs/apps-in-toss.md 3장 "SDK 대신 REST 로").
 *
 *   익명 로그인   Identity Toolkit accounts:signUp → 토큰은 localStorage, 만료되면 securetoken 으로 새로
 *   고스트 읽기   Firestore runQuery (altGhosts, 최근 80개) — 규칙상 로그인한 사람만 읽는다
 *   고스트 올리기 callable 함수 submitAltGhost 를 HTTP 로 ({data} 본문 + Bearer 토큰). 서버가 검사하고 이름을 붙인다
 *
 * 실패하면 조용히 빈 값 — 다트는 혼자 난다.
 */
const KEY = 'AIzaSyBMbtvHjj13Z-RYT13sOWcUp24rpcjualA'; // 웹 앱 키 (lib/firebase_options.dart 의 web)
const PROJECT = 'rocket-escape-mobs';
const FUNCTIONS = 'https://asia-northeast3-rocket-escape-mobs.cloudfunctions.net/';
const STORE = 'rocketOneStore.auth';

let auth = null; // { idToken, refreshToken, uid, exp }

function load() {
  try {
    auth = JSON.parse(localStorage.getItem(STORE) || 'null');
  } catch {
    auth = null;
  }
}

function keep() {
  try {
    localStorage.setItem(STORE, JSON.stringify(auth));
  } catch {}
}

async function token() {
  if (!auth) load();
  const now = Date.now();
  if (auth?.idToken && auth.exp - 60000 > now) return auth.idToken;
  if (auth?.refreshToken) {
    const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(auth.refreshToken)}`,
    });
    if (r.ok) {
      const j = await r.json();
      auth = { idToken: j.id_token, refreshToken: j.refresh_token, uid: j.user_id, exp: now + Number(j.expires_in) * 1000 };
      keep();
      return auth.idToken;
    }
  }
  const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ returnSecureToken: true }),
  });
  if (!r.ok) throw new Error(`signUp ${r.status}`);
  const j = await r.json();
  auth = { idToken: j.idToken, refreshToken: j.refreshToken, uid: j.localId, exp: now + Number(j.expiresIn) * 1000 };
  keep();
  return auth.idToken;
}

/** Firestore REST 값 하나 → JS 값. */
function value(f) {
  if (!f) return null;
  if ('stringValue' in f) return f.stringValue;
  if ('integerValue' in f) return Number(f.integerValue);
  if ('doubleValue' in f) return f.doubleValue;
  if ('booleanValue' in f) return f.booleanValue;
  return null;
}

/** 최근 고스트 80개와 내 uid 를 JSON 글로. 못 읽으면 ''. */
async function altGhosts() {
  const t = await token();
  const r = await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents:runQuery`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${t}` },
    body: JSON.stringify({
      structuredQuery: {
        from: [{ collectionId: 'altGhosts' }],
        orderBy: [{ field: { fieldPath: 'at' }, direction: 'DESCENDING' }],
        limit: 80,
      },
    }),
  });
  if (!r.ok) throw new Error(`runQuery ${r.status}`);
  const ghosts = [];
  for (const row of await r.json()) {
    const f = row.document?.fields;
    if (!f) continue;
    ghosts.push({ uid: value(f.uid), name: value(f.name), rocket: value(f.rocket), alt: value(f.alt), escaped: value(f.escaped) });
  }
  return JSON.stringify({ uid: auth?.uid ?? null, ghosts });
}

/** callable 함수를 HTTP 로. 서버가 받았으면 true. */
async function call(name, data) {
  const t = await token();
  const r = await fetch(FUNCTIONS + name, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${t}` },
    body: JSON.stringify({ data }),
  });
  return r.ok;
}

/** 내 uid 와 정한 닉네임 (profiles/{uid}, 없으면 null) 을 JSON 글로. 못 읽으면 ''.
 * 문서 GET 은 이름을 안 정한 사람에게 404 라 CrazyGames QA 가 "Missing resource" 경고를 띄웠다 (2026-10-19) —
 * batchGet 은 없는 문서도 200 에 missing 으로 답한다. */
async function profile() {
  const t = await token();
  const base = `projects/${PROJECT}/databases/(default)/documents`;
  const r = await fetch(`https://firestore.googleapis.com/v1/${base}:batchGet`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${t}` },
    body: JSON.stringify({ documents: [`${base}/profiles/${auth.uid}`] }),
  });
  if (!r.ok) throw new Error(`profile ${r.status}`);
  const [row] = await r.json();
  const name = value(row?.found?.fields?.name);
  return JSON.stringify({ uid: auth.uid, name });
}

/** 닉네임 바꾸기 (함수 setName). 서버 답 {status, name} 을 JSON 글로, 못 닿으면 ''. */
async function setName(name) {
  const t = await token();
  const r = await fetch(FUNCTIONS + 'setName', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${t}` },
    body: JSON.stringify({ data: { name } }),
  });
  if (!r.ok) return '';
  return JSON.stringify((await r.json()).result ?? {});
}

window.rocketCloud = {
  profile: () => profile().catch(() => ''),
  setName: (name) => setName(name).catch(() => ''),
  altGhosts: () => altGhosts().catch(() => ''),
  submitAltGhost: (json) => call('submitAltGhost', JSON.parse(json)).catch(() => false),
};

})();</script>
